<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
            margin: 0;
        }
        .form-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }

        h2 { color: #2d3436; margin-top: 0; text-align: center; }
        p { text-align: center; color: #636e72; margin-bottom: 30px; }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2d3436;
        }

        input[type="text"],
        input[type="email"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box; 
        }
        input:focus, textarea:focus {
            border-color: #0984e3;
            outline: none;
        }
        .submit-btn {
            background-color: #00b894;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover {
            background-color: #00947a;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>Join Our Team </h2>
        <p>Complete the form below to apply.</p>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="M. mobeen" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="mobeen@example.com" required>
            </div>

            <div class="form-group">
                <label for="resume">Upload Resume (PDF only)</label>
                <input type="file" id="resume" name="resume" accept=".pdf" required>
            </div>

            <div class="form-group">
                <label for="cover-letter">Cover Letter</label>
                <textarea id="cover-letter" name="cover_letter" rows="4" placeholder="Tell us why you're a great fit..."></textarea>
            </div>

            <div class="form-group">
                <label for="references">Professional References</label>
                <textarea id="references" name="references" rows="3" placeholder="Name, Company, Contact info"></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Application</button>
        </form>
    </div>
</body>
</html>
