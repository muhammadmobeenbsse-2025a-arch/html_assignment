<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Product Catalog</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 40px 20px;
        }
        h1 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 40px;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .product-info {
            padding: 20px;
            text-align: center;
        }
        .product-name {
            font-size: 1.2rem;
            color: #2d3436;
            margin: 0 0 10px 0;
        }
        .product-desc {
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 15px;
        }
        .product-price {
            font-weight: bold;
            font-size: 1.3rem;
            color: #00b894; 
            margin-bottom: 20px;
        }
        .buy-btn {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .buy-btn:hover {
            background-color: #74b9ff;
        }
    </style>
</head>
